name: Release

# 推 v* tag 时，按平台矩阵打包真正的安装包，最后汇总到一个 GitHub Release。
# 日常提交走 ci.yml，不会被 15~25 分钟的 Tauri 打包拖慢。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 一台机器只打自己平台的包：Windows 出 msi/nsis + 便携 zip，
  # macOS 出 dmg（arm64 / x64 各一台），Linux 出 deb/rpm/appimage + 裸二进制。
  build:
    name: 打包 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: ""
            build_args: "--bundles msi nsis"
            artifact: convy-windows
          - os: macos-latest
            target: ""
            # macos-latest=arm64，打原生 aarch64 包，不传 --target
            build_args: "--bundles dmg"
            artifact: convy-macos-aarch64
          - os: macos-latest
            # GitHub 已基本下线 macos-13（Intel）runner，改在 arm64 上交叉编译 x86_64。
            # 注意：显式 --target 时产物会落在 target/<triple>/release/bundle/ 下，
            # 收集步骤已用 -path 通配兼容两种布局。
            target: x86_64-apple-darwin
            build_args: "--bundles dmg --target x86_64-apple-darwin"
            artifact: convy-macos-x86_64
          - os: ubuntu-22.04
            target: ""
            # ubuntu-22.04 的 glibc 2.35 是 Tauri 2 的兼容性基线，
            # 在更新的系统上打会要求更高的 glibc，老发行版跑不了。
            build_args: "--bundles deb rpm appimage"
            artifact: convy-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 非宿主（macOS 交叉/显式 target）时补上对应的 Rust target。
      - name: 添加 Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      # Windows 的 MSI 需要 WiX Toolset v3（v4/v5 的 schema 不兼容）。
      - name: 安装 WiX Toolset 3.14（仅 Windows）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest `
            -Uri https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip `
            -OutFile "$env:RUNNER_TEMP\wix314.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\wix314.zip" -DestinationPath C:\wix
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\wix'
          Write-Host "已安装 WiX：$(candle.exe -? 2>&1 | Select-Object -First 1)"

      # Linux 需要 WebKitGTK 4.1 + GTK + AppIndicator 头文件；
      # deb/rpm 打包用 FPM（Ruby），rpm 还需要 rpmbuild、deb 需要 dpkg-deb。
      - name: 安装 Linux 系统依赖
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            appstream \
            dpkg-dev \
            rpm \
            ruby ruby-dev build-essential

      - name: 安装 FPM（Tauri 打 deb/rpm 的依赖）
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo gem install --no-document fpm
          echo "$(ruby -e 'puts Gem.bindir')" >> "$GITHUB_PATH"

      - run: npm ci

      # 跑 beforeBuildCommand（tsc + vite build）再按平台打包
      - name: tauri build
        run: npm run app:build -- ${{ matrix.build_args }}

      # 通用：把 bundle 产物收进 release/
      # 注意 1：`cp -t` 是 GNU 专属，macOS 的 BSD cp 不支持，必须用 `cp {} dir \;`
      # 注意 2：显式 --target 构建时 bundle 在 target/<triple>/release/bundle/ 下，
      #         用 -path 通配同时覆盖 target/release/bundle 与 target/<triple>/release/bundle
      # 注意 3：bundle 目录里有 AppImage/deb 打包的中间产物（AppDir 里的 .so 等），
      #         必须按扩展名白名单过滤，否则发布时会传一堆垃圾库文件
      - name: 收集安装包
        shell: bash
        run: |
          mkdir -p release
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} release/ \;
          ls -l release

      # Windows 额外打包便携版（exe + 已声明的 resources）
      - name: 打包 Windows 便携 zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tmp = "$env:RUNNER_TEMP/convy-portable"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item src-tauri/target/release/convy.exe -Destination $tmp/
          New-Item -ItemType Directory -Force -Path $tmp/resources/engines | Out-Null
          Copy-Item src-tauri/engines/README.md -Destination $tmp/resources/engines/ -ErrorAction SilentlyContinue
          Compress-Archive -Path $tmp/* -DestinationPath release/Convy-portable-win64.zip
          Get-ChildItem release

      # Linux 额外打包裸二进制（供不想装包管理器的用户直接跑）
      - name: 打包 Linux 裸二进制
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          mkdir -p portable/resources/engines
          cp src-tauri/target/release/convy portable/ 2>/dev/null || true
          cp src-tauri/engines/README.md portable/resources/engines/ 2>/dev/null || true
          tar -czf release/Convy-linux-x86_64-bin.tar.gz -C portable .
          ls -la release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  # 所有平台的包收齐后，一次性发到同一个 GitHub Release。
  publish:
    name: 发布到 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # checkout 必须排在 download-artifact **之前**。
      # 它默认 clean: true，日志里是「Deleting the contents of ...」—— 会把工作区整个清空。
      # v1.2.1 首发时放在后面，于是 4 个刚下载好的产物被删掉，
      # 发布步骤只拿到 `Pattern 'all-artifacts/*' does not match any files`，
      # 发出去一个 0 产物的 Release。
      - uses: actions/checkout@v5
        with:
          # 要算「上一版是哪个 tag」，浅克隆拿不到 tag 历史
          fetch-depth: 0

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      # 护栏：产物为空时直接红，而不是发一个 0 附件的 Release。
      # v1.2.1 首发时就是这个样子 —— 发布步骤报的是
      # `Pattern 'all-artifacts/*' does not match any files`，但动作本身仍然成功，
      # 于是一个没有安装包的 Release 被推到了 latest 上。
      - name: 检查产物不为空
        run: |
          set -euo pipefail
          n=$(find all-artifacts -type f | wc -l)
          echo "产物文件数：$n"
          find all-artifacts -type f -printf '  %f\n' | sort
          if [ "$n" -eq 0 ]; then
            echo "::error::没有拿到任何安装包，拒绝发布空 Release"
            exit 1
          fi

      # 应用内更新靠这个文件确认安装包没被改过（见 src-tauri/src/updater.rs 的
      # 「完整性校验」一节）。哈希必须由 CI 在打包之后当场生成：若改成下载时现算，
      # 就等于用文件自己校验自己，毫无意义。
      #
      # 这里的断言不是装饰：应用端对「清单里找不到自己的名字」是硬失败的，
      # 一旦清单和产物对不上，所有用户都会卡在更新这一步。所以要在发版时红，
      # 而不是等到用户点「更新」才报错。
      - name: 生成 SHA256SUMS
        run: |
          set -euo pipefail
          cd all-artifacts
          : > SHA256SUMS
          for f in *; do
            if [ ! -f "$f" ]; then continue; fi
            if [ "$f" = "SHA256SUMS" ]; then continue; fi
            sha256sum "$f" >> SHA256SUMS
          done
          lines=$(wc -l < SHA256SUMS)
          files=$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l)
          echo "清单 $lines 行 / 产物 $files 个"
          if [ "$lines" -ne "$files" ]; then
            echo "::error::SHA256SUMS 行数与产物数不一致"
            exit 1
          fi
          cat SHA256SUMS

      # 应用里「设置 → 更新日志」显示的就是 Release 正文，所以正文得是给人读的。
      # GitHub 自动生成的说明靠 PR 归纳，而这个仓库直接往 master 提交，
      # 生成出来常常只有一行 Full Changelog 链接。改为从 CHANGELOG.md 取本版一节；
      # 取不到（比如补发旧 tag、或忘了写）才退回自动生成。
      - name: 取出本版更新日志
        id: notes
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          awk -v pat="## ${ver}" '
            index($0, pat) == 1 { on = 1; next }
            on && index($0, "## ") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md || true
          if [ -s notes.md ]; then
            if [ -n "$prev" ]; then
              printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> notes.md
            fi
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "已取到 ${ver} 的更新日志（$(wc -l < notes.md) 行），上一版 ${prev:-未知}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG.md 里没有 ${ver} 一节，改用自动生成的说明"
          fi

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: all-artifacts/*
          body_path: ${{ steps.notes.outputs.found == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
